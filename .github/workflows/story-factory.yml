# Runs the story factory on GitHub's servers with keys from encrypted repository secrets.
# Start it from the Actions tab ("Run workflow").
#   mode=check: tests + which models your keys can use (no paid generation)
#   mode=story: also researches Wikipedia and generates one real story
#   mode=bench: blind-compares the writing of `config` against `bench_against` on fixed pitches
#   mode=recheck: runs the legend recognition test on approved retellings that never had it
# Pipelines 1 and 2 are the stickman channel (story factory, video); 3 and 4 are the dramas:
#   mode=drama-series: pipeline 3 pitches and plans a new short-drama series
#   mode=drama-write: pipeline 3 writes the next episodes (story_id = how many, default 3)
#   mode=drama-check: pipeline 4 lists what each configured fal.ai model expects, and the Boson voices (no spend)
#   mode=drama-video: pipeline 4 makes the next approved episode's vertical video (story_id = an episode id), saved as drama-<run>
#   mode=video-bakeoff: pipeline 2 runs a few shots of a story (story_id, or the newest) through every
#               candidate model side by side (capped at $10), saved as video-<run number>
#   mode=video-approve / video-reject: after watching a video (story_id), approve it for publishing or not
#               (video-reject takes the reason in `overrides`)
#   mode=video-publish: uploads an approved video (story_id) to YouTube as private; set the time in
#               `overrides` (e.g. 2026-11-20T17:00:00Z) to schedule it instead
#   mode=video-stats: reads every published video's YouTube stats into the performance table
#   mode=video-check: pipeline 2 lists what each studio model on fal.ai expects (no spend)
#   mode=video: pipeline 2 turns the next approved story (or story_id) into a video, saved as
#               an artifact named video-<run number> for 14 days
# The story database carries over between runs (saved as an artifact, restored at the
# start of the next run), so stories never repeat and the shared world keeps growing.
# This repository is public: run logs and the summary are public, and so are artifacts to
# signed-in GitHub users. Secrets themselves are never shown.
name: Story factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = tests and model access only; story = generate one story; video = make the next approved story's video; bench = compare two model setups; recheck = re-check approved legends"
        type: choice
        options: [check, story, video, video-check, video-bakeoff, video-approve, video-reject, video-publish, video-stats, drama-check, drama-series, drama-write, drama-video, bench, recheck]
        default: check
      series:
        description: Series to generate in story mode
        type: choice
        options: [hollow_world, legends_retold]
        default: hollow_world
      ping_models:
        description: Optional comma-separated provider:model list to test instead of the configured roles
        type: string
        default: ""
      ping_timeout:
        description: Seconds to wait for each model in the test call
        type: string
        default: "120"
      config:
        description: Model setup
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.aws-open.toml
      bench_against:
        description: "bench mode: the model setup to compare against (B)"
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.example.toml
      story_id:
        description: "video: a story number; drama-video: an episode id; drama-write: how many episodes (default 3)"
        type: string
        default: ""
      overrides:
        description: "Optional config overrides, space-separated KEY=VALUE (e.g. quality.min_score=8)"
        type: string
        default: ""
      bench_pitches:
        description: "bench mode: how many fixed pitches (1-3)"
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write  # only to push review images to the review-media branch
  actions: read  # to find the story database saved by the previous run

concurrency:
  group: story-factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      BOSON_API_KEY: ${{ secrets.BOSON_API_KEY }}
      # YouTube publishing (OAuth for the channel; see PRODUCTION.md). Optional until you publish.
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MODE: ${{ inputs.mode }}
      SERIES: ${{ inputs.series }}
      CONFIG: ${{ inputs.config }}
      PING_MODELS: ${{ inputs.ping_models }}
      PING_TIMEOUT: ${{ inputs.ping_timeout }}
      BENCH_AGAINST: ${{ inputs.bench_against }}
      BENCH_PITCHES: ${{ inputs.bench_pitches }}
      OVERRIDES: ${{ inputs.overrides }}
      STORY_ID: ${{ inputs.story_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Check the AWS key is configured
        run: |
          if [ -z "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "::error::Add the AWS_BEARER_TOKEN_BEDROCK repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Model access
        # Lists every model ID the keys can use, so configured IDs can be corrected.
        run: python -m story_factory --config "$CONFIG" models --list --why || true

      - name: Test call to every model
        # A tiny real request per model. Failures are reported, not fatal: judge panels
        # carry on without a failed member, and generation stops if a needed model is down.
        continue-on-error: true
        run: |
          if [ -n "$PING_MODELS" ]; then
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}" --models "$PING_MODELS"
          else
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}"
          fi

      - name: Restore the story database from the last run
        if: env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || startsWith(env.MODE, 'video-') || startsWith(env.MODE, 'drama-')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/restore-story-db.sh

      - name: Wikipedia research
        if: env.MODE == 'story'
        run: python -m story_factory --config "$CONFIG" research --if-needed

      - name: Generate one story
        if: env.MODE == 'story'
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          python -m story_factory --config "$CONFIG" "${SETS[@]}" generate "$SERIES"

      - name: Cache the narrator voice model
        if: env.MODE == 'video' || env.MODE == 'video-bakeoff' || env.MODE == 'drama-video'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install video tools
        if: env.MODE == 'video' || env.MODE == 'video-bakeoff' || env.MODE == 'drama-video'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-video.txt

      - name: Make the video
        if: env.MODE == 'video' || env.MODE == 'video-bakeoff'
        run: |
          ARGS=()
          if [ -n "$STORY_ID" ]; then ARGS+=(--story "$STORY_ID"); fi
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          COMMAND=produce
          if [ "$MODE" = video-bakeoff ]; then COMMAND=bakeoff; fi
          python -m production --config "$CONFIG" "${SETS[@]}" "$COMMAND" "${ARGS[@]}" | tee video-summary.txt
          status=${PIPESTATUS[0]}
          { echo '## Video'; echo '```'; tail -c 60000 video-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Share review images
        if: always() && (env.MODE == 'video' || env.MODE == 'video-bakeoff')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/share-review.sh

      - name: Save the video
        if: always() && (env.MODE == 'video' || env.MODE == 'video-bakeoff')
        uses: actions/upload-artifact@v6
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Review, publish and stats
        if: contains(fromJSON('["video-approve", "video-reject", "video-publish", "video-stats"]'), env.MODE)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          P2=(python -m production --config "$CONFIG")
          case "$MODE" in
            video-approve) "${P2[@]}" approve --story "$STORY_ID" ;;
            video-reject)  "${P2[@]}" approve --story "$STORY_ID" --reject "${OVERRIDES:-no reason given}" ;;
            video-stats)   "${P2[@]}" stats ;;
            video-publish)
              .github/scripts/fetch-video.sh "$STORY_ID"
              AT=()
              if [ -n "$OVERRIDES" ]; then AT=(--at "$OVERRIDES"); fi
              "${P2[@]}" publish --story "$STORY_ID" --dir "out/story-$STORY_ID" "${AT[@]}" ;;
          esac 2>&1 | tee channel-output.txt
          status=${PIPESTATUS[0]}
          { echo "## $MODE"; echo '```'; cat channel-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Studio model check
        if: env.MODE == 'video-check'
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          python -m production --config "$CONFIG" "${SETS[@]}" check 2>&1 | tee video-check.txt
          { echo '## Studio models'; echo '```'; tail -c 60000 video-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Short drama series
        if: startsWith(env.MODE, 'drama-')
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          P3=(python -m drama_factory --config "$CONFIG" "${SETS[@]}")     # pipeline 3: writing
          P4=(python -m drama_production --config "$CONFIG" "${SETS[@]}")  # pipeline 4: video
          case "$MODE" in
            drama-check)  "${P4[@]}" check ;;
            drama-series) "${P3[@]}" series ;;
            drama-write)  "${P3[@]}" write --count "${STORY_ID:-3}" ;;
            drama-video)  if [ -n "$STORY_ID" ]; then "${P4[@]}" produce --episode "$STORY_ID"; else "${P4[@]}" produce; fi ;;
          esac 2>&1 | tee drama-output.txt
          status=${PIPESTATUS[0]}
          { echo "## $MODE"; echo '```'; tail -c 60000 drama-output.txt; echo '```'; echo '```'; "${P3[@]}" status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Save the episode video
        if: always() && env.MODE == 'drama-video'
        uses: actions/upload-artifact@v6
        with:
          name: drama-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Re-check approved retold legends
        if: env.MODE == 'recheck'
        run: python -m story_factory --config "$CONFIG" recheck | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Benchmark two model setups
        if: env.MODE == 'bench'
        run: |
          python -m story_factory --config "$CONFIG" bench --against "$BENCH_AGAINST" \
            --pitches "$BENCH_PITCHES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always() && env.MODE == 'story'
        run: |
          python -m story_factory --config "$CONFIG" report | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -m story_factory --config "$CONFIG" stats | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the story database
        if: always() && (env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || startsWith(env.MODE, 'video-') || startsWith(env.MODE, 'drama-'))
        uses: actions/upload-artifact@v6
        with:
          # The next run restores the newest one; each run re-saves it, so it never expires in use.
          name: story-db
          path: data/
          retention-days: 90
          if-no-files-found: ignore
