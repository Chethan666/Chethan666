# Runs the story factory on GitHub's servers with keys from encrypted repository secrets.
# Start it from the Actions tab ("Run workflow").
#   mode=check: tests + which models your keys can use (no paid generation)
#   mode=story: also researches Wikipedia and generates one real story
#   mode=bench: blind-compares the writing of `config` against `bench_against` on fixed pitches
#   mode=recheck: runs the legend recognition test on approved retellings that never had it
# Pipeline 1 is the story factory and pipeline 2 turns its stories into videos.
#   mode=video-test: pipeline 2 makes a ~35 s video from the script in production/samples/test_story.json
#     (overrides "script=one_minute.json" picks another script in production/samples, e.g. the 60 s test;
#      add "bakeoff=all" for the picture bake-off: no video, every picture painted by each setup, side by side;
#      "host=make" paints candidates for the Storyteller's fixed references instead, about $0.60)
#               (no story database needed), capped at $1.50
#   mode=video-approve / video-reject: after watching a video (story_id), approve it for publishing or not
#               (video-reject takes the reason in `overrides`)
#   mode=video-publish: uploads an approved video (story_id) to YouTube as private; set the time in
#               `overrides` (e.g. 2026-11-20T17:00:00Z) to schedule it instead
#   mode=video-stats: reads every published video's YouTube stats into the performance table
#   mode=video-share: re-shares an earlier video run's review images (story_id = that run's id)
#   mode=video-check: pipeline 2 lists what each paid model on fal.ai expects (no spend)
#   mode=sound-library: builds or extends the channel's sound library (published as the GitHub release
#               "sound-library") from free sources in sounds/sources.json: Kevin MacLeod, OpenGameArt CC0,
#               the Free Music Archive (and a Sonniss pack if one is listed). No paid calls.
#   mode=sound-library-music: the same, plus 9 score cues made with ACE-Step on fal.ai (about $0.25, capped at $1)
#   mode=video: pipeline 2 turns the next approved story (or story_id) into a video (film-still
#               pictures under camera moves, host + teller + character voices, music; made by the agent
#               team in production/stills), saved as an artifact named video-<run number> for 14 days.
#               overrides: stills.max_usd=10, stills.motion=none (pictures held still)
# The story database carries over between runs (saved as an artifact, restored at the
# start of the next run), so stories never repeat and the shared world keeps growing.
# Keep this repository private: run logs, artifacts, review images and the sound library release are
# then visible only to you. Secrets themselves are never shown.
name: Story factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = tests and model access only; story = generate one story; video = make the next approved story's video; bench = compare two model setups; recheck = re-check approved legends"
        type: choice
        options: [check, story, video, video-test, sound-library, sound-library-music, video-check, video-approve, video-reject, video-publish, video-stats, video-share, bench, recheck]
        default: check
      series:
        description: Series to generate in story mode
        type: choice
        options: [hollow_world, legends_retold]
        default: hollow_world
      ping_models:
        description: Optional comma-separated provider:model list to test instead of the configured roles
        type: string
        default: ""
      ping_timeout:
        description: Seconds to wait for each model in the test call
        type: string
        default: "120"
      config:
        description: Model setup
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.aws-open.toml
      bench_against:
        description: "bench mode: the model setup to compare against (B)"
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.example.toml
      story_id:
        description: "video: a story number"
        type: string
        default: ""
      overrides:
        description: "Optional config overrides, space-separated KEY=VALUE (e.g. quality.min_score=8)"
        type: string
        default: ""
      bench_pitches:
        description: "bench mode: how many fixed pitches (1-3)"
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write  # only to push review images to the review-media branch
  actions: read  # to find the story database saved by the previous run

concurrency:
  group: story-factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      # Free pictures for stills mode (Cloudflare Workers AI's daily allowance). Optional.
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # YouTube publishing (OAuth for the channel; see PRODUCTION.md). Optional until you publish.
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MODE: ${{ inputs.mode }}
      SERIES: ${{ inputs.series }}
      CONFIG: ${{ inputs.config }}
      PING_MODELS: ${{ inputs.ping_models }}
      PING_TIMEOUT: ${{ inputs.ping_timeout }}
      BENCH_AGAINST: ${{ inputs.bench_against }}
      BENCH_PITCHES: ${{ inputs.bench_pitches }}
      OVERRIDES: ${{ inputs.overrides }}
      STORY_ID: ${{ inputs.story_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Check the AWS key is configured
        run: |
          if [ -z "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "::error::Add the AWS_BEARER_TOKEN_BEDROCK repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Model access
        # Lists every model ID the keys can use, so configured IDs can be corrected.
        run: python -m story_factory --config "$CONFIG" models --list --why || true

      - name: Test call to every model
        # A tiny real request per model. Failures are reported, not fatal: judge panels
        # carry on without a failed member, and generation stops if a needed model is down.
        continue-on-error: true
        run: |
          if [ -n "$PING_MODELS" ]; then
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}" --models "$PING_MODELS"
          else
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}"
          fi

      - name: Restore the story database from the last run
        if: env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || env.MODE == 'video-test' || startsWith(env.MODE, 'video-')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/restore-story-db.sh

      - name: Wikipedia research
        if: env.MODE == 'story'
        run: python -m story_factory --config "$CONFIG" research --if-needed

      - name: Generate one story
        if: env.MODE == 'story'
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          python -m story_factory --config "$CONFIG" "${SETS[@]}" generate "$SERIES"

      - name: Cache the narrator voice and listener models
        if: env.MODE == 'video' || env.MODE == 'video-test'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-whisper-base-v2  # a new key: the listener's Whisper model joins the cache

      - name: Install video tools
        if: env.MODE == 'video' || env.MODE == 'video-test'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-video.txt

      - name: Make the video
        if: env.MODE == 'video' || env.MODE == 'video-test'
        env:
          GH_TOKEN: ${{ github.token }}  # reads the sound library release (private when the repository is)
        run: |
          ARGS=()
          if [ -n "$STORY_ID" ]; then ARGS+=(--story "$STORY_ID"); fi
          SETS=()
          SCRIPT=production/samples/test_story.json
          BAKEOFF=()
          for kv in $OVERRIDES; do
            case "$kv" in
              script=*) SCRIPT="production/samples/${kv#script=}" ;;  # video-test: another sample script
              bakeoff=*) BAKEOFF=(--bakeoff "${kv#bakeoff=}") ;;  # pictures only, by each setup (e.g. bakeoff=all)
              host=make) HOST_MAKE=1 ;;  # paint candidates for the Storyteller's fixed references (~$0.60)
              *) SETS+=(--set "$kv") ;;
            esac
          done
          if [ "$MODE" = video-test ]; then ARGS=(--script "$SCRIPT"); fi
          ARGS+=("${BAKEOFF[@]}")
          if [ -n "${HOST_MAKE:-}" ]; then
            python -m production --config "$CONFIG" "${SETS[@]}" host --out out/host_refs 2>&1 | tee video-summary.txt
            status=${PIPESTATUS[0]}
            { echo '## Host references'; echo '```'; tail -c 20000 video-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
          python -m production --config "$CONFIG" "${SETS[@]}" produce "${ARGS[@]}" 2>&1 | tee video-summary.txt
          status=${PIPESTATUS[0]}
          { echo '## Video'; echo '```'; tail -c 60000 video-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Save this video's new sounds into the sound library
        # Sounds the library lacked were generated (and paid for) once: they are added to the library so
        # later videos reuse them, and the library sounds used are counted (the least used are preferred).
        if: success() && (env.MODE == 'video' || env.MODE == 'video-test')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t RUNS < <(find out -name sounds_used.json -printf '%h\n' | sort -u)
          if [ "${#RUNS[@]}" -eq 0 ]; then echo "No sound report"; exit 0; fi
          if ! gh release view sound-library >/dev/null 2>&1; then echo "No sound library yet (run mode sound-library)"; exit 0; fi
          python -m production --config "$CONFIG" library sync --runs "${RUNS[@]}" --out build/library-sync
          gh release upload sound-library build/library-sync/* --clobber

      - name: Build the sound library
        if: startsWith(env.MODE, 'sound-library')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy soundfile datasets
          GEN=()
          if [ "$MODE" = sound-library-music ]; then GEN=(--generate-music --max-usd 1); fi
          # overrides "fresh": start the library over (the release is deleted and rebuilt from the sources)
          if [[ " $OVERRIDES " == *" fresh "* ]]; then
            gh release delete sound-library --yes --cleanup-tag || true
            GEN+=(--fresh)
          fi
          # overrides "only=opengameart,fma": run just those sources (adds to the current library)
          for kv in $OVERRIDES; do case "$kv" in only=*) GEN+=(--only "${kv#only=}") ;; esac; done
          python -m production --config "$CONFIG" library build "${GEN[@]}" --out build/library 2>&1 | tee library.txt
          if ! gh release view sound-library >/dev/null 2>&1; then
            gh release create sound-library --title "Sound library" --latest=false \
              --notes "The channel's music and sound library, built from sounds/sources.json. library.json is the catalogue; CREDITS.md lists every source and license."
          fi
          FILES=(build/library/*)
          echo "Uploading ${#FILES[@]} files"
          gh release upload sound-library "${FILES[@]}" --clobber
          python -m production --config "$CONFIG" library show --existing build/library/library.json --out build/show > library-show.txt
          { echo '## Sound library'; echo '```'; tail -c 30000 library.txt; echo; head -250 library-show.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Share review images
        if: always() && (env.MODE == 'video' || env.MODE == 'video-test')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/share-review.sh

      - name: Save the video
        if: always() && (env.MODE == 'video' || env.MODE == 'video-test')
        uses: actions/upload-artifact@v6
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Review, publish and stats
        if: contains(fromJSON('["video-approve", "video-reject", "video-publish", "video-stats"]'), env.MODE)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          P2=(python -m production --config "$CONFIG")
          case "$MODE" in
            video-approve) "${P2[@]}" approve --story "$STORY_ID" ;;
            video-reject)  "${P2[@]}" approve --story "$STORY_ID" --reject "${OVERRIDES:-no reason given}" ;;
            video-stats)   "${P2[@]}" stats ;;
            video-publish)
              .github/scripts/fetch-video.sh "$STORY_ID"
              AT=()
              if [ -n "$OVERRIDES" ]; then AT=(--at "$OVERRIDES"); fi
              "${P2[@]}" publish --story "$STORY_ID" --dir "out/story-$STORY_ID" "${AT[@]}" ;;
          esac 2>&1 | tee channel-output.txt
          status=${PIPESTATUS[0]}
          { echo "## $MODE"; echo '```'; cat channel-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Share an earlier run's review images
        if: env.MODE == 'video-share'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          artifact=$(gh api "repos/$REPO/actions/runs/$STORY_ID/artifacts" --jq \
            '[.artifacts[] | select(.name | startswith("video-"))] | first | .id // empty')
          number=$(gh api "repos/$REPO/actions/runs/$STORY_ID" --jq .run_number)
          gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/v.zip"
          mkdir -p out && unzip -o -q "$RUNNER_TEMP/v.zip" -d out
          GITHUB_RUN_NUMBER=$number .github/scripts/share-review.sh

      - name: Paid model check
        if: env.MODE == 'video-check'
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          python -m production --config "$CONFIG" "${SETS[@]}" check 2>&1 | tee video-check.txt
          { echo '## Paid models'; echo '```'; tail -c 60000 video-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-check approved retold legends
        if: env.MODE == 'recheck'
        run: python -m story_factory --config "$CONFIG" recheck | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Benchmark two model setups
        if: env.MODE == 'bench'
        run: |
          python -m story_factory --config "$CONFIG" bench --against "$BENCH_AGAINST" \
            --pitches "$BENCH_PITCHES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always() && env.MODE == 'story'
        run: |
          python -m story_factory --config "$CONFIG" report | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -m story_factory --config "$CONFIG" stats | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the story database
        if: always() && (env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || env.MODE == 'video-test' || startsWith(env.MODE, 'video-'))
        uses: actions/upload-artifact@v6
        with:
          # The next run restores the newest one; each run re-saves it, so it never expires in use.
          name: story-db
          path: data/
          retention-days: 90
          if-no-files-found: ignore
