# Runs on the Bedrock models this AWS account can use today (open-weight models from five
# companies), with a local stand-in for embeddings. Needs only AWS_BEARER_TOKEN_BEDROCK.
# Switch to config.aws-only.toml once Claude and GPT are available on the account.

database = "data/stories.db"

[budget]
monthly_cap_usd = 0

[roles]
# Single-model roles fail over to the next model listed.
pitchers   = ["aws:moonshotai.kimi-k2.5", "aws:zai.glm-5", "aws:deepseek.v3.2"]
# Six companies, so every comparison gets independent judges.
# Best judges first: contests use the first three independent ones. Mistral is last
# because it often loops on comparisons and viewer reports until its output limit.
judges     = ["aws:qwen.qwen3-235b-a22b-2507", "aws:zai.glm-5", "aws:deepseek.v3.2",
              "aws:minimax.minimax-m2.5", "aws:mistral.mistral-large-3-675b-instruct"]
writers    = ["aws:moonshotai.kimi-k2.5", "aws:zai.glm-5"]
reviser    = ["aws:moonshotai.kimi-k2.5", "aws:zai.glm-5"]
audience   = ["aws:qwen.qwen3-235b-a22b-2507", "aws:minimax.minimax-m2.5"]
polisher   = ["aws:moonshotai.kimi-k2.5", "aws:zai.glm-5"]
researcher = ["aws:deepseek.v3.2", "aws:qwen.qwen3-235b-a22b-2507"]
planner    = ["aws:deepseek.v3.2", "aws:qwen.qwen3-235b-a22b-2507"]
embedder   = ["local:hash"]

[providers.aws]
region = "us-east-1"

[quality]
# Allow an extra editing round; these models revise in smaller steps.
max_revisions = 3
# The publishing bar. Live runs at 8 still approved stories from these models, with the
# showrunner re-planning and fixing what fell short.
min_score = 8
