# Runs the story factory on GitHub's servers with keys from encrypted repository secrets.
# Start it from the Actions tab ("Run workflow").
#   mode=check: tests + which models your keys can use (no paid generation)
#   mode=story: also researches Wikipedia and generates one real story
#   mode=bench: blind-compares the writing of `config` against `bench_against` on fixed pitches
#   mode=recheck: runs the legend recognition test on approved retellings that never had it
#   mode=drama-check: lists what each configured fal.ai model expects, and the Boson voices (no spend)
#   mode=drama-series: writes a new short-drama series bible
#   mode=drama-write: writes the next episodes (story_id = how many, default 3)
#   mode=drama-video: makes the next approved episode's vertical video (story_id = an episode id), saved as drama-<run>
#   mode=video: pipeline 2 turns the next approved story (or story_id) into a video, saved as
#               an artifact named video-<run number> for 14 days
# The story database carries over between runs (saved as an artifact, restored at the
# start of the next run), so stories never repeat and the shared world keeps growing.
# This repository is public: run logs and the summary are public, and so are artifacts to
# signed-in GitHub users. Secrets themselves are never shown.
name: Story factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = tests and model access only; story = generate one story; video = make the next approved story's video; bench = compare two model setups; recheck = re-check approved legends"
        type: choice
        options: [check, story, video, drama-check, drama-series, drama-write, drama-video, bench, recheck]
        default: check
      series:
        description: Series to generate in story mode
        type: choice
        options: [hollow_world, legends_retold]
        default: hollow_world
      ping_models:
        description: Optional comma-separated provider:model list to test instead of the configured roles
        type: string
        default: ""
      ping_timeout:
        description: Seconds to wait for each model in the test call
        type: string
        default: "120"
      config:
        description: Model setup
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.aws-open.toml
      bench_against:
        description: "bench mode: the model setup to compare against (B)"
        type: choice
        options: [config.aws-open.toml, config.aws-top.toml, config.aws-only.toml, config.example.toml]
        default: config.example.toml
      story_id:
        description: "video: a story number; drama-video: an episode id; drama-write: how many episodes (default 3)"
        type: string
        default: ""
      overrides:
        description: "Optional config overrides, space-separated KEY=VALUE (e.g. quality.min_score=8)"
        type: string
        default: ""
      bench_pitches:
        description: "bench mode: how many fixed pitches (1-3)"
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: read
  actions: read  # to find the story database saved by the previous run

concurrency:
  group: story-factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      BOSON_API_KEY: ${{ secrets.BOSON_API_KEY }}
      MODE: ${{ inputs.mode }}
      SERIES: ${{ inputs.series }}
      CONFIG: ${{ inputs.config }}
      PING_MODELS: ${{ inputs.ping_models }}
      PING_TIMEOUT: ${{ inputs.ping_timeout }}
      BENCH_AGAINST: ${{ inputs.bench_against }}
      BENCH_PITCHES: ${{ inputs.bench_pitches }}
      OVERRIDES: ${{ inputs.overrides }}
      STORY_ID: ${{ inputs.story_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Check the AWS key is configured
        run: |
          if [ -z "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "::error::Add the AWS_BEARER_TOKEN_BEDROCK repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Model access
        # Lists every model ID the keys can use, so configured IDs can be corrected.
        run: python -m story_factory --config "$CONFIG" models --list --why || true

      - name: Test call to every model
        # A tiny real request per model. Failures are reported, not fatal: judge panels
        # carry on without a failed member, and generation stops if a needed model is down.
        continue-on-error: true
        run: |
          if [ -n "$PING_MODELS" ]; then
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}" --models "$PING_MODELS"
          else
            python -m story_factory --config "$CONFIG" ping --timeout "${PING_TIMEOUT:-120}"
          fi

      - name: Restore the story database from the last run
        if: env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || startsWith(env.MODE, 'drama-')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/restore-story-db.sh

      - name: Wikipedia research
        if: env.MODE == 'story'
        run: python -m story_factory --config "$CONFIG" research --if-needed

      - name: Generate one story
        if: env.MODE == 'story'
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          python -m story_factory --config "$CONFIG" "${SETS[@]}" generate "$SERIES"

      - name: Cache the narrator voice model
        if: env.MODE == 'video' || env.MODE == 'drama-video'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install video tools
        if: env.MODE == 'video' || env.MODE == 'drama-video'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-video.txt

      - name: Make the video
        if: env.MODE == 'video'
        run: |
          ARGS=()
          if [ -n "$STORY_ID" ]; then ARGS+=(--story "$STORY_ID"); fi
          python -m production --config "$CONFIG" produce "${ARGS[@]}" | tee video-summary.txt
          { echo '## Video'; echo '```'; cat video-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the video
        if: always() && env.MODE == 'video'
        uses: actions/upload-artifact@v6
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Short drama series
        if: startsWith(env.MODE, 'drama-')
        run: |
          SETS=()
          for kv in $OVERRIDES; do SETS+=(--set "$kv"); done
          D=(python -m drama --config "$CONFIG" "${SETS[@]}")
          case "$MODE" in
            drama-check)  "${D[@]}" check ;;
            drama-series) "${D[@]}" series ;;
            drama-write)  "${D[@]}" write --count "${STORY_ID:-3}" ;;
            drama-video)  if [ -n "$STORY_ID" ]; then "${D[@]}" produce --episode "$STORY_ID"; else "${D[@]}" produce; fi ;;
          esac 2>&1 | tee drama-output.txt
          status=${PIPESTATUS[0]}
          { echo "## $MODE"; echo '```'; tail -c 60000 drama-output.txt; echo '```'; "${D[@]}" status; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Save the episode video
        if: always() && env.MODE == 'drama-video'
        uses: actions/upload-artifact@v6
        with:
          name: drama-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Re-check approved retold legends
        if: env.MODE == 'recheck'
        run: python -m story_factory --config "$CONFIG" recheck | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Benchmark two model setups
        if: env.MODE == 'bench'
        run: |
          python -m story_factory --config "$CONFIG" bench --against "$BENCH_AGAINST" \
            --pitches "$BENCH_PITCHES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always() && env.MODE == 'story'
        run: |
          python -m story_factory --config "$CONFIG" report | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -m story_factory --config "$CONFIG" stats | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the story database
        if: always() && (env.MODE == 'story' || env.MODE == 'recheck' || env.MODE == 'video' || startsWith(env.MODE, 'drama-'))
        uses: actions/upload-artifact@v6
        with:
          # The next run restores the newest one; each run re-saves it, so it never expires in use.
          name: story-db
          path: data/
          retention-days: 90
          if-no-files-found: ignore
