# Copy to config.toml. Anything left out uses the defaults in story_factory/config.py.

database = "data/stories.db"

[budget]
# Optional hard stop in USD per month across both pipelines; 0 means no cap.
monthly_cap_usd = 0

# Writers' room. Format: provider:model[@effort]. Providers: anthropic, openai, google, xai.
# Run `python -m story_factory models` to check each one against your API keys.
# Balanced (default): the strongest affordable writer writes; cheaper models judge and test.
[roles]
pitchers   = ["anthropic:claude-sonnet-5-5@high", "google:gemini-3-pro-preview", "xai:grok-4.7"]
judges     = ["anthropic:claude-sonnet-5-5@high", "google:gemini-3-pro-preview", "openai:gpt-5-mini@high", "xai:grok-4.7"]
writers    = ["anthropic:claude-opus-5-5@high", "xai:grok-4.7"]
reviser    = ["anthropic:claude-opus-5-5@high"]
audience   = ["google:gemini-3-flash-preview", "openai:gpt-5-mini@low"]
polisher   = ["anthropic:claude-opus-5-5@high"]
researcher = ["anthropic:claude-sonnet-5-5@high"]
planner    = ["anthropic:claude-sonnet-5-5@medium"]
embedder   = ["google:gemini-embedding-001"]

# Premium preset (roughly 2-3x the cost): replace the lines above with these.
# pitchers = ["anthropic:claude-fable-5-1@high", "openai:gpt-5.5@high", "google:gemini-3-pro-preview"]
# judges   = ["anthropic:claude-opus-5-5@high", "openai:gpt-5.5@high", "google:gemini-3-pro-preview"]
# writers  = ["anthropic:claude-fable-5-1@high", "anthropic:claude-fable-5-1@xhigh", "openai:gpt-5.5@high"]
# reviser  = ["anthropic:claude-fable-5-1@high"]
# audience = ["openai:gpt-5.5@medium", "google:gemini-3-pro-preview"]
# polisher = ["anthropic:claude-fable-5-1@high"]
# researcher = ["anthropic:claude-opus-5-5@high"]
# planner  = ["anthropic:claude-opus-5-5@medium"]

[backlog]
# Approved stories to keep ready for the production pipeline.
hollow_world = 4
legends_retold = 2
sixty_seconds = 8

[quality]
# Median editor score every category must reach (out of 10).
min_score = 8
max_revisions = 2
